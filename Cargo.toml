[workspace]
resolver = "2"
members = [
    "crates/cogzilla-tiff",
    "crates/cogzilla-codec",
    "crates/cogzilla-proj",
    "crates/cogzilla-kernel",
    "crates/cogzilla-io",
    "crates/cogzilla-server",
    "crates/cogzilla-lambda",
    "benches/cogmark",
]

[workspace.package]
version = "0.7.23"
edition = "2024"
license = "MIT"

[workspace.dependencies]
thiserror = "2"
bytes = "1"
crc32fast = "1"
libdeflater = "1.22"
zstd-sys = "2"
libwebp-sys = "0.11"
jpeg-encoder = "0.6"
zune-jpeg = "0.4"
memmap2 = "0.9"
dashmap = "6"
parking_lot = "0.12"
ahash = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "client-legacy"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lambda_http = { version = "0.14", default-features = false, features = ["apigw_http", "apigw_rest", "alb"] }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
